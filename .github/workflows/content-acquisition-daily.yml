name: Daily content acquisition

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum items per source"
        required: false
        default: "50"
        type: string
      article_mode:
        description: "Article publication stage; protected auto-publish is the daily default"
        required: false
        default: "auto-publish"
        type: choice
        options:
          - disabled
          - discover-only
          - review-only
          - auto-publish
      media_mode:
        description: "Video/podcast publication stage; protected auto-publish is the daily default"
        required: false
        default: "auto-publish"
        type: choice
        options:
          - disabled
          - discover-only
          - review-only
          - auto-publish
      media_canary_only:
        description: "Host one previously approved video only; skip discovery and publishing"
        required: false
        default: false
        type: boolean

concurrency:
  group: content-acquisition-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ${{ fromJSON(vars.CONTENT_MEDIA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    environment: content-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install podcast processing tools
        if: ${{ inputs.media_canary_only || (inputs.media_mode || vars.CONTENT_MEDIA_DAILY_MODE || 'auto-publish') == 'auto-publish' }}
        env:
          BGUTIL_PROVIDER_CONTAINER: bgutil-ytdlp-pot-provider-${{ github.run_id }}
          VIDEO_TOOLS_ENABLED: ${{ inputs.media_canary_only || (inputs.media_mode || vars.CONTENT_MEDIA_DAILY_MODE || 'auto-publish') == 'auto-publish' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          if [ "$VIDEO_TOOLS_ENABLED" = "true" ]; then
            python -m pip install --disable-pip-version-check --no-warn-script-location yt-dlp bgutil-ytdlp-pot-provider==2.0.0
            pnpm exec playwright install --with-deps chromium
            docker run --rm --detach --name "$BGUTIL_PROVIDER_CONTAINER" --publish 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.0
            for attempt in {1..30}; do
              if python -c "import socket; connection = socket.create_connection(('127.0.0.1', 4416), timeout=1); connection.close()"; then
                break
              fi
              sleep 1
            done
            python -c "import socket; connection = socket.create_connection(('127.0.0.1', 4416), timeout=1); connection.close()"
          fi
      - name: Register owner-authorized Readlang policy
        if: ${{ !inputs.media_canary_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm content:register-readlang-links
      - name: Register explicit Language Reactor audio redirect hosts
        if: ${{ !inputs.media_canary_only && vars.LANGUAGE_REACTOR_PODCAST_AUDIO_HOSTS != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEDIA_VIDEO_HOSTING_CONFIRM: ${{ secrets.MEDIA_VIDEO_HOSTING_CONFIRM }}
          LANGUAGE_REACTOR_PODCAST_AUDIO_HOSTS: ${{ vars.LANGUAGE_REACTOR_PODCAST_AUDIO_HOSTS }}
          LANGUAGE_REACTOR_PODCAST_TEMPORARY_MEDIA_PROCESSING: ${{ vars.LANGUAGE_REACTOR_PODCAST_TEMPORARY_MEDIA_PROCESSING || 'source-audio' }}
          LANGUAGE_REACTOR_PODCAST_RESET_CURSOR: ${{ vars.LANGUAGE_REACTOR_PODCAST_RESET_CURSOR || 'false' }}
        run: pnpm exec tsx scripts/register-language-reactor-audio-hosts.ts
      - name: Enable owner-authorized Language Reactor video processing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEDIA_VIDEO_HOSTING_CONFIRM: ${{ secrets.MEDIA_VIDEO_HOSTING_CONFIRM }}
          LANGUAGE_REACTOR_VIDEO_TEMPORARY_MEDIA_PROCESSING: ${{ vars.LANGUAGE_REACTOR_VIDEO_TEMPORARY_MEDIA_PROCESSING || 'yt-dlp' }}
        run: pnpm exec tsx scripts/register-language-reactor-video-policy.ts
      - name: Run staged article pipeline
        id: article_daily
        if: ${{ !inputs.media_canary_only }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CONTENT_ARTICLE_REVIEW_PROVIDER: ${{ vars.CONTENT_ARTICLE_REVIEW_PROVIDER || 'minimax' }}
          CONTENT_ARTICLE_REVISION_PROVIDER: ${{ vars.CONTENT_ARTICLE_REVISION_PROVIDER || 'minimax' }}
          CONTENT_ARTICLE_SOURCE_LIMIT: ${{ vars.CONTENT_ARTICLE_SOURCE_LIMIT || '10' }}
          CONTENT_ARTICLE_REVIEW_CONCURRENCY: ${{ vars.CONTENT_ARTICLE_REVIEW_CONCURRENCY || '2' }}
          CONTENT_ARTICLE_PUBLICATION_POLICY_VERSION: ${{ vars.CONTENT_ARTICLE_PUBLICATION_POLICY_VERSION || 'readlang-links-v6' }}
          CONTENT_ARTICLE_AUTO_PUBLISH_KILL_SWITCH: ${{ vars.CONTENT_ARTICLE_AUTO_PUBLISH_KILL_SWITCH || 'false' }}
          ARTICLE_MODE: ${{ inputs.article_mode || vars.CONTENT_ARTICLE_DAILY_MODE || 'auto-publish' }}
          ARTICLE_DAILY_LIMIT: ${{ vars.CONTENT_ARTICLE_DAILY_LIMIT || '10' }}
        run: >-
          set -o pipefail
          &&
          test -n "$ARTICLE_MODE"
          &&
          pnpm content:pipeline -- article-daily
          --mode "$ARTICLE_MODE"
          --daily-limit "$ARTICLE_DAILY_LIMIT"
          --source-limit "${CONTENT_ARTICLE_SOURCE_LIMIT:-10}"
          --policy-version "${CONTENT_ARTICLE_PUBLICATION_POLICY_VERSION:-}" 2>&1
          | tee "$RUNNER_TEMP/article-daily.log"
      - name: Run staged media pipeline
        id: media_daily
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUNNY_STORAGE_ZONE_NAME: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_REGION: ${{ vars.BUNNY_STORAGE_REGION || 'storage' }}
          BUNNY_STORAGE_PULL_ZONE_HOSTNAME: ${{ vars.BUNNY_STORAGE_PULL_ZONE_HOSTNAME }}
          MEDIA_VIDEO_HOSTING_CONFIRM: ${{ secrets.MEDIA_VIDEO_HOSTING_CONFIRM }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          MEDIA_VIDEO_AUTHORIZED_ASSET_DIR: ${{ vars.CONTENT_MEDIA_AUTHORIZED_ASSET_DIR }}
          YTDLP_BIN: yt-dlp
          FFMPEG_BIN: ffmpeg
          CONTENT_MEDIA_REVIEW_PROVIDER: ${{ vars.CONTENT_MEDIA_REVIEW_PROVIDER || 'minimax' }}
          CONTENT_MEDIA_REVISION_PROVIDER: ${{ vars.CONTENT_MEDIA_REVISION_PROVIDER || 'minimax' }}
          CONTENT_MEDIA_REVIEW_CONCURRENCY: ${{ vars.CONTENT_MEDIA_REVIEW_CONCURRENCY || '2' }}
          CONTENT_MEDIA_AUTO_PUBLISH_KILL_SWITCH: ${{ vars.CONTENT_MEDIA_AUTO_PUBLISH_KILL_SWITCH || 'false' }}
          CONTENT_MEDIA_REQUIRE_BILINGUAL_SUBTITLES: ${{ vars.CONTENT_MEDIA_REQUIRE_BILINGUAL_SUBTITLES || 'true' }}
          CONTENT_MEDIA_PROVIDER_MODE: ${{ vars.CONTENT_MEDIA_PROVIDER_MODE || 'live' }}
          CONTENT_MEDIA_STT_PROVIDER: ${{ vars.CONTENT_MEDIA_STT_PROVIDER || 'minimax' }}
          CONTENT_MEDIA_TRANSLATION_PROVIDER: ${{ vars.CONTENT_MEDIA_TRANSLATION_PROVIDER || 'minimax' }}
          OPENAI_TRANSCRIPTION_MODEL: ${{ vars.OPENAI_TRANSCRIPTION_MODEL || 'gpt-transcribe' }}
          OPENAI_TRANSCRIPTION_ENDPOINT: ${{ vars.OPENAI_TRANSCRIPTION_ENDPOINT || 'https://api.openai.com/v1/audio/transcriptions' }}
          MINIMAX_TRANSCRIPTION_MODEL: ${{ vars.MINIMAX_TRANSCRIPTION_MODEL || 'asr-1.0' }}
          MINIMAX_TRANSCRIPTION_API_ENDPOINT: ${{ vars.MINIMAX_TRANSCRIPTION_API_ENDPOINT || 'https://api.minimax.cn/v1/speech_to_text' }}
          MEDIA_MODE: ${{ inputs.media_mode || vars.CONTENT_MEDIA_DAILY_MODE || 'auto-publish' }}
          MEDIA_VIDEO_DAILY_LIMIT: ${{ vars.CONTENT_MEDIA_VIDEO_DAILY_LIMIT || '10' }}
          MEDIA_PODCAST_DAILY_LIMIT: ${{ vars.CONTENT_MEDIA_PODCAST_DAILY_LIMIT || '10' }}
          MEDIA_SOURCE_LIMIT: ${{ vars.CONTENT_MEDIA_SOURCE_LIMIT || '10' }}
          CONTENT_MEDIA_SOURCE_TIMEOUT_MS: ${{ vars.CONTENT_MEDIA_SOURCE_TIMEOUT_MS || '180000' }}
          CONTENT_MEDIA_CANDIDATE_TIMEOUT_MS: ${{ vars.CONTENT_MEDIA_CANDIDATE_TIMEOUT_MS || '900000' }}
          MEDIA_VIDEO_HOSTING_CANARY_ONLY: ${{ inputs.media_canary_only }}
          MEDIA_VIDEO_CANARY_DIAGNOSTICS: ${{ inputs.media_canary_only }}
        run: |
          set -o pipefail
          if [ "$MEDIA_VIDEO_HOSTING_CANARY_ONLY" = "true" ]; then
          export MEDIA_VIDEO_HOSTING_LIMIT=1;
          export MEDIA_VIDEO_HOSTING_CANARY_ONLY=true;
          pnpm exec tsx scripts/host-video-candidates-to-bunny.ts 2>&1 | tee "$RUNNER_TEMP/media-daily.log";
          elif [ "$MEDIA_MODE" = "auto-publish" ]; then
          pnpm content:pipeline -- media-daily --mode review-only --daily-limit 20 --video-daily-limit "$MEDIA_VIDEO_DAILY_LIMIT" --podcast-daily-limit "$MEDIA_PODCAST_DAILY_LIMIT" --require-bilingual-subtitles --source-limit "$MEDIA_SOURCE_LIMIT" 2>&1 | tee "$RUNNER_TEMP/media-daily.log";
          if [ "$MEDIA_VIDEO_DAILY_LIMIT" -gt 0 ]; then
            export MEDIA_VIDEO_HOSTING_LIMIT="$MEDIA_VIDEO_DAILY_LIMIT";
            pnpm exec tsx scripts/host-video-candidates-to-bunny.ts || test "$?" = "2";
          else
            echo '{"stage":"video-host","status":"skipped","reason":"video-daily-limit-zero"}' | tee -a "$RUNNER_TEMP/media-daily.log";
          fi
          pnpm content:pipeline -- media-daily --mode auto-publish --daily-limit 20 --video-daily-limit "$MEDIA_VIDEO_DAILY_LIMIT" --podcast-daily-limit "$MEDIA_PODCAST_DAILY_LIMIT" --require-bilingual-subtitles --source-limit "$MEDIA_SOURCE_LIMIT" 2>&1 | tee -a "$RUNNER_TEMP/media-daily.log";
          else
          pnpm content:pipeline -- media-daily --mode "$MEDIA_MODE" --daily-limit 20 --video-daily-limit "$MEDIA_VIDEO_DAILY_LIMIT" --podcast-daily-limit "$MEDIA_PODCAST_DAILY_LIMIT" --require-bilingual-subtitles --source-limit "$MEDIA_SOURCE_LIMIT" 2>&1 | tee "$RUNNER_TEMP/media-daily.log";
          fi
      - name: Stop PO Token provider
        if: ${{ always() && inputs.media_canary_only }}
        env:
          BGUTIL_PROVIDER_CONTAINER: bgutil-ytdlp-pot-provider-${{ github.run_id }}
        run: docker rm --force "$BGUTIL_PROVIDER_CONTAINER" 2>/dev/null || true
      - name: Cleanup expired candidates and artifacts
        if: ${{ always() && !inputs.media_canary_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm content:pipeline -- cleanup --limit 100
      - name: Write acquisition report
        if: ${{ always() && !inputs.media_canary_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm content:pipeline -- report --limit 100
      - name: Write redacted summary
        if: always()
        run: |
          summarize_stage() {
            local label="$1"
            local path="$2"
            node - "$label" "$path" <<'NODE'
          const fs = require("node:fs");
          const [label, path] = process.argv.slice(2);
          let result = null;
          if (fs.existsSync(path)) {
            const lines = fs.readFileSync(path, "utf8").split(/\r?\n/u).reverse();
            for (const line of lines) {
              if (!line.trim().startsWith("{")) continue;
              try { result = JSON.parse(line); break; } catch {}
            }
          }
          if (!result) {
            console.log(`- ${label}: no structured stage result (check the workflow step outcome)`);
          } else if (result.canaryOnly) {
            console.log(`- ${label}: canaryOnly=true, candidate=${result.canaryCandidateId ?? "none"}, candidatesChecked=${result.candidatesChecked ?? 0}, hosted=${result.hosted ?? 0}, failed=${result.failed ?? 0}, authorizedMp4=${result.authorizedMp4 ?? 0}, youtube=${result.youtube ?? 0}, publication=skipped`);
          } else {
            const counts = result.counts ?? {};
            const failures = Array.isArray(result.failures) ? result.failures.length : 0;
            const publishedByType = result.publishedByType ?? {};
            const targetDeficitByType = result.targetDeficitByType ?? {};
            console.log(`- ${label}: status=${result.status ?? "unknown"}, discovered=${counts.discovered ?? 0}, approved=${counts.approved ?? 0}, published=${counts.published ?? 0}, videoPublished=${publishedByType.video ?? 0}, podcastPublished=${publishedByType.podcast ?? 0}, videoDeficit=${targetDeficitByType.video ?? 0}, podcastDeficit=${targetDeficitByType.podcast ?? 0}, failures=${failures}`);
          }
          NODE
          }
          {
            echo '## Daily content run'
            echo '- Secrets, article bodies, provider responses, and query credentials are intentionally omitted.'
            echo "- Requested mode: ${{ inputs.article_mode || vars.CONTENT_ARTICLE_DAILY_MODE || 'unset' }}"
            echo "- Requested article limit: ${{ vars.CONTENT_ARTICLE_DAILY_LIMIT || '10' }}"
            echo "- Media mode: ${{ inputs.media_mode || vars.CONTENT_MEDIA_DAILY_MODE || 'auto-publish' }}"
            echo "- Video hosting canary only: ${{ inputs.media_canary_only }}"
            echo "- Media targets: video=0 (paused), podcast=${{ vars.CONTENT_MEDIA_PODCAST_DAILY_LIMIT || '10' }}, bilingual subtitles required=${{ vars.CONTENT_MEDIA_REQUIRE_BILINGUAL_SUBTITLES || 'true' }}"
            summarize_stage "Articles" "$RUNNER_TEMP/article-daily.log"
            summarize_stage "Media" "$RUNNER_TEMP/media-daily.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail after independent stage attempts
        if: always() && (steps.article_daily.outcome == 'failure' || steps.media_daily.outcome == 'failure')
        run: exit 1

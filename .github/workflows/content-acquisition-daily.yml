name: Daily content acquisition

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover metadata without writing candidates"
        required: false
        default: false
        type: boolean
      limit:
        description: "Maximum items per source"
        required: false
        default: "50"
        type: string

concurrency:
  group: content-acquisition-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    environment: content-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Discover configured source
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CONTENT_ACQUISITION_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: >-
          pnpm content:pipeline -- discover --all-enabled
          --limit "${{ inputs.limit || '50' }}"
          $([ "$CONTENT_ACQUISITION_DRY_RUN" = "true" ] && printf '%s' '--dry-run' || true)

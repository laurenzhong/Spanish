name: temporary full e2e
on:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full Playwright suite
        env:
          AUTH_E2E_ENABLED: "1"
          DATABASE_URL: ""
          MINIMAX_API_KEY: ""
          OPENAI_API_KEY: ""
          SPEECHACE_API_KEY: ""
        run: pnpm exec playwright test --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-e2e-report
          path: |
            playwright-report
            test-results

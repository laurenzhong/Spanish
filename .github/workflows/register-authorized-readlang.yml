name: Register authorized Readlang policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    environment: content-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Register owner-authorized exact URL snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm content:register-readlang-links

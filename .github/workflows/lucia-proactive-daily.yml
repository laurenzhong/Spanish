name: Lucía proactive messages

on:
  schedule:
    # Poll every 15 minutes; each user's stable daily slots decide whether to send.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: lucia-proactive-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proactive:
    runs-on: ubuntu-latest
    continue-on-error: false
    environment: content-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # LUCIA-CI-001/002/003/004: main still reads user state through
          # character_id, so the scheduler stays pinned to the identity-aware
          # runtime until main includes CHAR-IDENTITY-001. The pinned commit
          # must also list every published character revision in its runtime
          # capability manifest; production currently serves lucia@3, and a pin
          # that does not know that revision fails due slots with
          # CHARACTER_UNAVAILABLE. It also labels safety-gate rejections and
          # retries provider outages or rejected samples up to 3 times per slot.
          # LUCIA-CI-004 additionally disables postgres.js's internal type-fetch
          # query (its unretained promise crashed run 39692576920 on a transient
          # statement timeout) and reports process-level failures as one JSON
          # line. CONV-LANG-002 adds the English-fragment language gate: a sample
          # that mixes English into Spanish now fails as
          # `safety-gate-english-fragment` and is resampled by the retry path
          # instead of being stored (run 39895246964 wrote "Acabo de Wake Up y
          # foster me he acordado de ti" at 2026-10-23T03:29:36Z). Update this
          # ref whenever the production character revision changes; see
          # docs/operations/lucia-proactive-runbook.md.
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Lucía message
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LUCIA_PROACTIVE_USER_IDS: ${{ vars.LUCIA_PROACTIVE_USER_IDS }}
          CONVERSATION_PROVIDER: ${{ vars.CONVERSATION_PROVIDER || 'deepseek' }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_API_ENDPOINT: ${{ vars.MINIMAX_API_ENDPOINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: ${{ vars.OPENAI_API_ENDPOINT || 'https://api.deepseek.com/v1' }}
          OPENAI_API_STYLE: ${{ vars.OPENAI_API_STYLE || 'chat-completions' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}
          OPENAI_CONVERSATION_MODEL: ${{ vars.OPENAI_CONVERSATION_MODEL || 'deepseek-flash' }}
        continue-on-error: false
        run: pnpm conversation:proactive

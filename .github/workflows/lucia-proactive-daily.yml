name: Lucía proactive messages

on:
  schedule:
    # Poll every 15 minutes; each user's stable daily slots decide whether to send.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: lucia-proactive-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proactive:
    runs-on: ubuntu-latest
    continue-on-error: false
    environment: content-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the scheduled runner on the serialized candidate-completion
          # runtime. Update this pin whenever the production character runtime
          # changes; see docs/operations/lucia-proactive-runbook.md.
          ref: 0af175856f699eb5f97525149765a41f1037d04f
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Lucía message
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LUCIA_PROACTIVE_USER_IDS: ${{ vars.LUCIA_PROACTIVE_USER_IDS }}
          CONVERSATION_PROVIDER: ${{ vars.CONVERSATION_PROVIDER || 'deepseek' }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_API_ENDPOINT: ${{ vars.MINIMAX_API_ENDPOINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: ${{ vars.OPENAI_API_ENDPOINT || 'https://api.deepseek.com/v1' }}
          OPENAI_API_STYLE: ${{ vars.OPENAI_API_STYLE || 'chat-completions' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}
          OPENAI_CONVERSATION_MODEL: ${{ vars.OPENAI_CONVERSATION_MODEL || 'deepseek-flash' }}
        continue-on-error: false
        run: pnpm conversation:proactive
